# =========================================================================
#  Cau hinh chay Automated UI Test cho VinScape
#  Co the override tung gia tri bang -D khi chay maven, vi du:
#    mvn test -Dbase.url=http://localhost:8080/shareholder-system -Dheadless=false
# =========================================================================

# URL goc cua ung dung (Apache Tomcat, context path = shareholder-system)
base.url=http://localhost:8080/shareholder-system

# Trinh duyet: chromium | firefox | webkit
browser=chromium

# true = chay an (CI), false = mo cua so trinh duyet len de xem truc tiep
headless=false

# Do tre giua cac hanh dong (ms) - de 0 khi chay that, tang len khi debug bang mat
slowmo=10

# Timeout mac dinh cho moi hanh dong / assertion (ms)
default.timeout=40000

# ---------------------------------------------------------------------
# Tai khoan test (theo du lieu seed cua snapshot01db)
# Truong "login" co the la username hoac email - LoginServlet chap nhan ca hai.
# ---------------------------------------------------------------------
admin.login=admin@snapshot01.local
admin.password=Admin@123

it.login=it@snapshot01.local
it.password=IT@123

shareholder.login=user2
shareholder.password=user2
