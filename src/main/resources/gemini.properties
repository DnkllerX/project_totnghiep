# Cau hinh Tro ly AI (Chatbox) su dung Google Gemini API.
#
# api key: BI MAT, chi dung server-side (ChatbotService) - TUYET DOI khong nhung vao JSP/JS,
#          khong commit len Git. Lay API key tai: https://aistudio.google.com/app/apikey
#
# Sau khi co key, doi "gemini.enabled=false" thanh "true" va dan key vao "gemini.api.key".

gemini.enabled=true
gemini.api.key=

# Model Gemini su dung cho chatbox. Co the doi sang model khac (vd gemini-2.5-flash-lite,
# gemini-2.5-flash...) ma khong can sua code, chi can sua dong duoi day.
gemini.model=gemini-3.1-flash-lite

# Base URL cua Gemini REST API (KHONG bao gom ten model va action ":generateContent").
# ChatbotService se tu ghep thanh: {base.url}/{model}:generateContent?key={api.key}
gemini.api.base.url=https://generativelanguage.googleapis.com/v1beta/models

# Timeout goi API (giay) va so cau tra loi truoc do (history) toi da gui kem moi request
# de giu ngu canh hoi thoai ma khong lam payload qua lon.
gemini.timeout.seconds=20
gemini.max.history=10
gemini.max.output.tokens=1024
gemini.temperature=0.4

# Gioi han so tin nhan 1 phien (session) duoc goi AI, chong lam dung/spam chi phi API.
gemini.max.messages.per.session=60

# Chi dan he thong (system instruction) dinh hinh vai tro cua tro ly AI.
gemini.system.prompt=Ban la VinScape AI - tro ly ao cua He thong Quan ly Co dong VinScape. \
  Nhiem vu cua ban la ho tro nguoi dung (khach hoac co dong/nhan vien da dang nhap) hieu va \
  su dung he thong: dang ky/dang nhap tai khoan, ky nhan co phan, bieu quyet nghi quyet, \
  gui yeu cau chuyen nhuong co phan, xem bao cao tai chinh va tai lieu noi bo, quan ly ho so \
  ca nhan. Tra loi ngan gon, ro rang, lich su, chuyen nghiep, uu tien tieng Viet co dau. Neu \
  cau hoi lien quan du lieu ca nhan/giao dich cu the (so du co phan, trang thai duyet...), \
  huong dan nguoi dung dang nhap va vao dung muc trong he thong de xem, khong bia so lieu. \
  Neu ngoai pham vi he thong quan ly co dong, tra loi ngan gon roi khoeo leo dua ve chu de \
  ho tro su dung he thong.
